name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: macOS universal
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_MIRROR: "https://github.com/electron/electron/releases/download/"
      npm_config_registry: "https://registry.npmjs.org"
      npm_config_replace_registry_host: "registry.npmmirror.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Build renderer
        run: npm run build
      - name: Test shared runtime and project isolation
        run: npm test
      - name: Package macOS app
        run: npx electron-builder --mac --universal --publish never
      - name: Install smoke-test tooling
        run: |
          npm install --no-save --package-lock=false playwright
          command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Exercise packaged runtime and video decoding
        env:
          FLOW_CANVAS_SMOKE_ASAR: ${{ github.workspace }}/release/mac-universal/Flow Canvas.app/Contents/Resources/app.asar
          FLOW_CANVAS_SMOKE_VIDEO: "1"
        run: node scripts/agent-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: flow-canvas-macos-universal
          path: release/*.dmg
          if-no-files-found: error
