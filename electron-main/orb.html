<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Canvas</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            border: 0;
            outline: 0;
            background: rgba(0, 0, 0, 0) !important;
            box-shadow: none;
        }

        body {
            display: grid;
            place-items: center;
            user-select: none;
        }

        .orb {
            position: relative;
            width: 54px;
            height: 54px;
            padding: 0;
            border: 1px solid rgba(125, 184, 255, 0.58);
            border-radius: 50%;
            background: #080812;
            color: rgba(238, 246, 255, 0.96);
            cursor: grab;
            overflow: visible;
            outline: none;
            box-shadow:
                0 4px 11px rgba(0, 0, 0, 0.48),
                0 0 11px rgba(53, 129, 255, 0.48);
            transition: transform 160ms ease, filter 160ms ease;
        }

        .orb::before {
            content: '';
            position: absolute;
            inset: -9px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(67, 156, 255, 0.28), transparent 70%);
            animation: halo 2.4s ease-in-out infinite;
        }

        .orb::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background:
                radial-gradient(ellipse 72% 58% at 34% 28%, rgba(189, 232, 255, 0.95), transparent 55%),
                radial-gradient(ellipse 58% 74% at 70% 64%, rgba(119, 75, 231, 0.78), transparent 58%),
                radial-gradient(ellipse 50% 48% at 54% 42%, rgba(0, 219, 255, 0.72), transparent 54%),
                radial-gradient(circle at 50% 50%, #12236a, #070914 72%);
            animation: flow 4.2s ease-in-out infinite;
        }

        .orb:hover {
            transform: scale(1.07);
            filter: brightness(1.12);
        }

        .orb.dragging {
            cursor: grabbing;
            transform: scale(1.04);
            filter: brightness(1.18);
            transition: none;
        }

        .orb.dragging::before,
        .orb.dragging::after {
            animation-play-state: paused;
        }

        .orb:focus-visible {
            box-shadow: 0 0 0 2px white, 0 0 24px rgba(53, 129, 255, 0.8);
        }

        .orb.restoring {
            transform: scale(0.88);
            filter: brightness(1.35);
        }

        .orb.drop-target {
            transform: scale(1.12);
            border-color: rgba(255, 210, 64, 0.95);
            box-shadow:
                0 4px 11px rgba(0, 0, 0, 0.48),
                0 0 0 4px rgba(255, 210, 64, 0.2),
                0 0 22px rgba(255, 210, 64, 0.78);
        }

        .orb.drop-success {
            border-color: rgba(83, 225, 151, 0.95);
            filter: brightness(1.28);
            box-shadow:
                0 4px 11px rgba(0, 0, 0, 0.48),
                0 0 0 4px rgba(83, 225, 151, 0.2),
                0 0 22px rgba(83, 225, 151, 0.78);
        }

        .orb.drop-error {
            border-color: rgba(255, 102, 102, 0.96);
            filter: brightness(1.2);
            box-shadow:
                0 4px 11px rgba(0, 0, 0, 0.48),
                0 0 0 4px rgba(255, 102, 102, 0.18),
                0 0 20px rgba(255, 102, 102, 0.72);
        }

        .orb-mark {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 20px;
            border-radius: 8px;
            background: rgba(245, 249, 255, 0.92);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 9px rgba(171, 223, 255, 0.9);
        }

        @keyframes flow {
            0%, 100% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
            35% { transform: rotate(18deg) scale(1.06); filter: hue-rotate(18deg); }
            68% { transform: rotate(-12deg) scale(0.98); filter: hue-rotate(-12deg); }
        }

        @keyframes halo {
            0%, 100% { opacity: 0.55; transform: scale(0.94); }
            50% { opacity: 1; transform: scale(1.08); }
        }
    </style>
</head>
<body>
    <button class="orb" id="orbButton" type="button" title="左键拖动，轻点恢复" aria-label="拖动或恢复 Flow Canvas">
        <span class="orb-mark" aria-hidden="true"></span>
    </button>
</body>
</html>
